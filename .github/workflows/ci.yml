name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build AgentHarness.sln --configuration Release
      - run: dotnet run --project tests/AgentHarness.Tests/AgentHarness.Tests.csproj --configuration Release
      - run: /bin/sh tests/Installer.Tests/install-sh-tests.sh

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Claude install dry run
        run: dotnet run --project src/AgentHarness/AgentHarness.csproj --configuration Release -- install --tools claude --dry-run
      - name: CLI regression tests
        run: dotnet run --project tests/AgentHarness.Tests/AgentHarness.Tests.csproj --configuration Release
      - name: Windows PowerShell 5.1 installer tests
        shell: powershell
        run: .\tests\Installer.Tests\install-ps1-tests.ps1
      - name: PowerShell 7 installer tests
        if: always()
        shell: pwsh
        run: .\tests\Installer.Tests\install-ps1-tests.ps1
