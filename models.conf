# Single source of truth for role-to-model assignments.
#
# Keep values to portable model identifiers or aliases supported by the target
# tool. Run the installer again after changing this file. The orchestrator model
# is advisory because it is selected in each tool's UI or primary config; the
# remaining values are rendered into installed agent definitions.

CODEX_ORCHESTRATOR_MODEL=gpt-6.1-sol
CODEX_REVIEWER_MODEL=gpt-6.1-sol
CODEX_WORKER_MODEL=gpt-6.1-sol
CODEX_EXPLORER_MODEL=gpt-6-luna
CODEX_VERIFIER_MODEL=gpt-6-luna

CLAUDE_ORCHESTRATOR_MODEL=claude-opus-5-5
CLAUDE_REVIEWER_MODEL=claude-opus-5-5
CLAUDE_WORKER_MODEL=claude-sonnet-5-5
CLAUDE_EXPLORER_MODEL=claude-haiku-5-5
CLAUDE_VERIFIER_MODEL=claude-haiku-5-5
